<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('bottlezero_theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e9f6e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="BottleZero" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="description" content="Track bottles saved, find refill stations, earn badges, and reduce single-use plastic waste. Built for the Congressional App Challenge." />
    <meta property="og:title" content="BottleZero — Reduce Single-Use Plastic" />
